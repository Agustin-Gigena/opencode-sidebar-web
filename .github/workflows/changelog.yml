name: Update Changelog

on:
  push:
    branches:
      - production
    paths-ignore:
      - "cliff.toml"
      - "cliff.es.toml"

permissions:
  contents: write
  actions: write

jobs:
  changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Detect version and create tag
        run: python3 scripts/detect-version.py

      - name: Generate and merge English changelog
        run: |
          git-cliff --unreleased --config cliff.toml --output _new.md
          if [ -s _new.md ]; then
            python3 scripts/merge-changelog.py _new.md CHANGELOG.md
            rm -f _new.md
          else
            echo "No new English entries to add"
          fi

      - name: Generate and merge Spanish changelog
        run: |
          git-cliff --unreleased --config cliff.es.toml --output _new.es.md
          if [ -s _new.es.md ]; then
            python3 scripts/merge-changelog.py _new.es.md CHANGELOG.es.md
            rm -f _new.es.md
          else
            echo "No new Spanish entries to add"
          fi

      - name: Commit changelogs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update CHANGELOG.md and CHANGELOG.es.md [skip ci]"
          file_pattern: CHANGELOG.md CHANGELOG.es.md

      - name: Trigger release workflow
        if: env.NEW_VERSION != ''
        run: |
          gh workflow run release.yml --ref production -f version=${{ env.NEW_VERSION }}
          echo "Release workflow triggered for v${{ env.NEW_VERSION }}"
