name: Release VSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run compile
      - run: npm run lint

      - name: Install opencode for tests
        run: npm install opencode-ai --no-audit --no-fund

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Update version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build extension
        run: npm run esbuild

      - name: Package VSIX
        run: npx vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-sidebar-web-${{ inputs.version }}
          path: "*.vsix"

      - name: Generate summary
        run: |
          echo "## Release `${{ inputs.version }}`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El VSIX se generó correctamente." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Descarga" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`opencode-sidebar-web-${{ inputs.version }}.vsix\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Descargar desde**: [${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
